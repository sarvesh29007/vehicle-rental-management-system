{% extends "base.html" %}

{% block title %}Error {{ code }} - Vehicle Rental{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 40px auto; text-align: center; padding: 40px;">
  <div style="font-size: 3rem; margin-bottom: 12px;">⚠️</div>
  <h1 style="font-size: 1.8rem; color: #1e293b; margin-bottom: 8px;">HTTP Error {{ code }}</h1>
  <p style="color: #64748b; margin-bottom: 24px;">{{ message }}</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Portal</a>
</div>
{% endblock %}
